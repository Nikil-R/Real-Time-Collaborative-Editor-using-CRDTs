name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *" # nightly: full property run and a short load test

jobs:
  js:
    name: CRDT, client, web (typecheck, unit, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:crdt
      - run: pnpm typecheck:client
      - name: CRDT tests (reduced property runs on push/PR, full run nightly)
        run: pnpm test:crdt
        env:
          FC_RUNS: ${{ github.event_name == 'schedule' && '100000' || '2000' }}
      - run: pnpm test:client
      - run: pnpm --filter @rce/web typecheck
      - run: pnpm test:web
      - run: pnpm --filter @rce/loadtest typecheck
      - run: pnpm build:web

  server:
    name: Server (ruff, pytest on SQLite and PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: collab
          POSTGRES_PASSWORD: collab
          POSTGRES_DB: collab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U collab" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Tests on SQLite with fake Redis
        run: uv run pytest -q
      - name: Migration applies to an empty PostgreSQL database
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql://collab:collab@localhost:5432/collab
      - name: Tests on PostgreSQL and real Redis
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://collab:collab@localhost:5432/collab
          TEST_REDIS_URL: redis://localhost:6379/0

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [js, server]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: server
      - run: pnpm --filter @rce/web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          PW_CHANNEL: chromium
          CI: "true"

  load-nightly:
    name: Nightly load and chaos run
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: [js, server]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: server
      - run: pnpm loadtest --clients 20 --duration 30 --spawn-server
      - run: pnpm loadtest --clients 20 --duration 30 --chaos --spawn-server --port 8211

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env:
          DOMAIN: localhost
