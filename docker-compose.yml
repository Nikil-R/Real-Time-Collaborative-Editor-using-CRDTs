# Local development and demo stack.
#   docker compose up --build                 PostgreSQL, Redis, server, web, Prometheus, Grafana
#   docker compose --profile scale up --build adds a second server process (Redis fan-out)
#   docker compose --profile demo up --build  adds Caddy for HTTPS (set DOMAIN)
#
# The passwords below are for LOCAL use only. Override them through a .env file
# (never commit it) before exposing anything.
name: collab

x-server: &server
  build: ./server
  restart: unless-stopped
  environment: &server-env
    DATABASE_URL: postgresql://collab:${POSTGRES_PASSWORD:-collab}@postgres:5432/collab
    REDIS_URL: redis://redis:6379/0
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    MAX_MESSAGE_BYTES: "262144"
    MAX_OPS_PER_BATCH: "500"
    RATE_LIMIT_OPS_PER_SEC: "200"
    LOG_LEVEL: info
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collab}
      POSTGRES_DB: collab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published to the host: only the server talks to it.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    <<: *server
    ports:
      - "8000:8000"

  server2:
    <<: *server
    profiles: ["scale"]
    ports:
      - "8001:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - server

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  caddy:
    image: caddy:2-alpine
    profiles: ["demo"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to your host name}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - server

volumes:
  pgdata:
  grafana-data:
  caddy-data:
